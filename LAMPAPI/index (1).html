<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Variables ─────────────────────────────────────── */
    :root {
      --black:   #0f0f0f;
      --white:   #fafafa;
      --gold:    #e8b84b;
      --gold-dk: #c49a35;
      --gray-1:  #1c1c1c;
      --gray-2:  #2a2a2a;
      --gray-3:  #555;
      --gray-4:  #999;
      --gray-5:  #e5e5e5;
      --red:     #e05555;
      --green:   #4caf7d;
      --radius:  10px;
      --trans:   all 0.2s ease;
    }

    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Toast notifications ───────────────────────────── */
    #toast {
      position: fixed; top: 1.5rem; right: 1.5rem;
      z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem;
    }
    .toast-msg {
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      font-size: 0.875rem; font-weight: 500;
      animation: slideIn 0.25s ease;
      max-width: 320px;
    }
    .toast-msg.success { background: var(--green); color: #fff; }
    .toast-msg.error   { background: var(--red);   color: #fff; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Views (pages) ─────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ════════════════════════════════════════════════════
       AUTH PAGE
    ════════════════════════════════════════════════════ */
    #auth-view {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(232,184,75,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(232,184,75,0.05) 0%, transparent 50%),
        var(--black);
    }

    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: -0.5px;
    }
    .auth-logo p {
      font-size: 0.8rem;
      color: var(--gray-4);
      margin-top: 0.25rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      background: var(--gray-2);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 1.75rem;
    }
    .auth-tab {
      flex: 1; padding: 0.5rem;
      border: none; background: transparent;
      color: var(--gray-4);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem; font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: var(--trans);
    }
    .auth-tab.active {
      background: var(--gold);
      color: var(--black);
    }

    /* Forms */
    .auth-form { display: none; flex-direction: column; gap: 1rem; }
    .auth-form.active { display: flex; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field label { font-size: 0.8rem; font-weight: 500; color: var(--gray-4); letter-spacing: 0.05em; text-transform: uppercase; }
    .field input {
      background: var(--gray-2);
      border: 1px solid var(--gray-2);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      transition: var(--trans);
      outline: none;
    }
    .field input:focus {
      border-color: var(--gold);
      background: #222;
    }
    .field input::placeholder { color: var(--gray-3); }

    .btn-primary {
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: var(--radius);
      padding: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      transition: var(--trans);
      margin-top: 0.5rem;
    }
    .btn-primary:hover { background: var(--gold-dk); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ════════════════════════════════════════════════════
       DASHBOARD
    ════════════════════════════════════════════════════ */
    #dashboard-view {
      display: none;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 90% 10%, rgba(232,184,75,0.06) 0%, transparent 50%),
        var(--black);
    }
    #dashboard-view.active { display: flex; flex-direction: column; }

    /* Nav */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--gray-2);
      background: rgba(15,15,15,0.9);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.35rem;
      color: var(--gold);
    }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user { font-size: 0.85rem; color: var(--gray-4); }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--gray-2);
      color: var(--gray-4);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--trans);
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* Main layout */
    .dashboard-main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Toolbar */
    .toolbar {
      display: flex; gap: 1rem; align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1; position: relative; min-width: 200px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      border-radius: var(--radius);
      padding: 0.7rem 1rem 0.7rem 2.75rem;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: var(--trans);
    }
    .search-wrap input:focus { border-color: var(--gold); }
    .search-wrap input::placeholder { color: var(--gray-3); }
    .search-icon {
      position: absolute; left: 0.9rem; top: 50%;
      transform: translateY(-50%);
      color: var(--gray-3); font-size: 1rem; pointer-events: none;
    }
    .btn-add {
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: var(--radius);
      padding: 0.7rem 1.25rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
      transition: var(--trans);
      white-space: nowrap;
    }
    .btn-add:hover { background: var(--gold-dk); }

    /* Stats row */
    .stats-row {
      display: flex; gap: 1rem; margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      flex: 1; min-width: 120px;
    }
    .stat-card .num {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem; color: var(--gold); line-height: 1;
    }
    .stat-card .lbl {
      font-size: 0.75rem; color: var(--gray-4);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    /* Contact list */
    #contacts-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .contact-card {
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
      transition: var(--trans);
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .contact-card:hover { border-color: var(--gray-3); background: #1e1e1e; }

    .contact-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--black);
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-weight: 600; font-size: 0.95rem; }
    .contact-meta {
      font-size: 0.8rem; color: var(--gray-4);
      margin-top: 0.15rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .contact-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-icon {
      background: var(--gray-2);
      border: none;
      color: var(--gray-4);
      width: 32px; height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--trans);
      display: flex; align-items: center; justify-content: center;
    }
    .btn-icon.edit:hover  { background: var(--gold); color: var(--black); }
    .btn-icon.del:hover   { background: var(--red);  color: #fff; }

    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--gray-4);
    }
    .empty-state .big { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 0.9rem; }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--gray-2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ════════════════════════════════════════════════════
       MODAL
    ════════════════════════════════════════════════════ */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 500;
      align-items: center; justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      border-radius: 16px;
      padding: 2rem;
      width: 100%; max-width: 460px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.35rem; color: var(--gold);
    }
    .btn-close {
      background: none; border: none;
      color: var(--gray-4); font-size: 1.25rem;
      cursor: pointer; transition: var(--trans);
      line-height: 1;
    }
    .btn-close:hover { color: var(--white); }

    .modal-form { display: flex; flex-direction: column; gap: 1rem; }
    .form-row { display: flex; gap: 1rem; }
    .form-row .field { flex: 1; }

    .modal-footer {
      display: flex; gap: 0.75rem; justify-content: flex-end;
      margin-top: 1.5rem;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--gray-2);
      color: var(--gray-4);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; cursor: pointer;
      transition: var(--trans);
    }
    .btn-cancel:hover { border-color: var(--gray-3); color: var(--white); }
    .btn-save {
      background: var(--gold); color: var(--black);
      border: none; border-radius: var(--radius);
      padding: 0.65rem 1.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: var(--trans);
    }
    .btn-save:hover { background: var(--gold-dk); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Confirm delete modal */
    #confirm-modal .modal { max-width: 360px; text-align: center; }
    #confirm-modal .confirm-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    #confirm-modal p { color: var(--gray-4); font-size: 0.9rem; margin-top: 0.5rem; }
    #confirm-modal .modal-footer { justify-content: center; }
    .btn-danger {
      background: var(--red); color: #fff;
      border: none; border-radius: var(--radius);
      padding: 0.65rem 1.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: var(--trans);
    }
    .btn-danger:hover { background: #c94444; }
  </style>
</head>
<body>

<!-- ── Toast container ───────────────────────────────────── -->
<div id="toast"></div>

<!-- ════════════════════════════════════════════════════════
     AUTH VIEW
════════════════════════════════════════════════════════ -->
<div id="auth-view" class="view active">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>ContactVault</h1>
      <p>Personal Contact Manager</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Log In</button>
      <button class="auth-tab" onclick="switchTab('register')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Log In</button>
    </form>

    <!-- Register Form -->
    <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
      <div class="field">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="johndoe" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min. 8 characters" required minlength="8" />
      </div>
      <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
    </form>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
     DASHBOARD VIEW
════════════════════════════════════════════════════════ -->
<div id="dashboard-view" class="view">
  <nav>
    <span class="nav-brand">ContactVault</span>
    <div class="nav-right">
      <span class="nav-user">👤 <span id="nav-username"></span></span>
      <button class="btn-logout" onclick="handleLogout()">Log out</button>
    </div>
  </nav>

  <div class="dashboard-main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="stat-total">0</div>
        <div class="lbl">Total Contacts</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-results">0</div>
        <div class="lbl">Showing</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search by name, email, or phone…" />
      </div>
      <button class="btn-add" onclick="openAddModal()">+ Add Contact</button>
    </div>

    <!-- Contact list -->
    <div id="contacts-list">
      <div class="spinner"></div>
    </div>

  </div>
</div>

<!-- ════════════════════════════════════════════════════════
     ADD / EDIT CONTACT MODAL
════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="contact-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Contact</span>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-form">
      <input type="hidden" id="edit-id" />
      <div class="form-row">
        <div class="field">
          <label>First Name *</label>
          <input type="text" id="c-first" placeholder="John" required />
        </div>
        <div class="field">
          <label>Last Name *</label>
          <input type="text" id="c-last" placeholder="Doe" required />
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="c-email" placeholder="john@example.com" />
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" id="c-phone" placeholder="(555) 000-0000" />
      </div>
      <div class="field">
        <label>Notes</label>
        <input type="text" id="c-notes" placeholder="Optional notes…" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="save-btn" onclick="handleSaveContact()">Save Contact</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
     DELETE CONFIRM MODAL
════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="confirm-icon">🗑️</div>
    <div class="modal-title">Delete Contact?</div>
    <p>This action cannot be undone.</p>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────
// Update this to your actual domain when deployed
const API = '/lamp_api/api';

// ── State ──────────────────────────────────────────────────
let allContacts  = [];
let currentUser  = null;
let searchTimer  = null;

// ══════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = `toast-msg ${type}`;
  el.textContent = msg;
  t.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function showView(name) {
  document.querySelectorAll('.view, #dashboard-view').forEach(v => {
    v.classList.remove('active');
    v.style.display = 'none';
  });
  const el = document.getElementById(`${name}-view`);
  el.classList.add('active');
  el.style.display = name === 'dashboard' ? 'flex' : 'block';
}

async function apiCall(endpoint, method = 'GET', body = null) {
  const opts = {
    method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + endpoint, opts);
  const data = await res.json();
  return { ok: res.ok, status: res.status, data };
}

function initials(first, last) {
  return (first[0] + (last[0] || '')).toUpperCase();
}

// ══════════════════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════════════════

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0) === (tab === 'login'));
  });
  document.getElementById('login-form').classList.toggle('active', tab === 'login');
  document.getElementById('register-form').classList.toggle('active', tab === 'register');
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Logging in…';

  const { ok, data } = await apiCall('/auth/login.php', 'POST', {
    email:    document.getElementById('login-email').value,
    password: document.getElementById('login-password').value,
  });

  btn.disabled = false; btn.textContent = 'Log In';

  console.log('Login response:', ok, data);
  if (ok) {
    currentUser = { id: data.user_id, username: data.username };
    enterDashboard();
  } else {
    showToast(data.error || 'Login failed', 'error');
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('register-btn');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const { ok, data } = await apiCall('/auth/register.php', 'POST', {
    username: document.getElementById('reg-username').value,
    email:    document.getElementById('reg-email').value,
    password: document.getElementById('reg-password').value,
  });

  btn.disabled = false; btn.textContent = 'Create Account';

  if (ok) {
    showToast('Account created! Please log in.');
    switchTab('login');
  } else {
    showToast(data.error || 'Registration failed', 'error');
  }
}

async function handleLogout() {
  await apiCall('/auth/logout.php', 'POST');
  currentUser = null;
  allContacts = [];
  showView('auth');
  switchTab('login');
}

// ══════════════════════════════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════════════════════════════

function enterDashboard() {
  console.log('entering dashboard, user:', currentUser);
  document.getElementById('nav-username').textContent = currentUser.username;
  showView('dashboard');
  loadContacts();

  // Search — debounced, real-time, server-side
  const searchInput = document.getElementById('search-input');
  searchInput.value = '';
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = searchInput.value.trim();
      if (q) {
        searchContacts(q);
      } else {
        loadContacts();
      }
    }, 300);
  });
}

async function loadContacts() {
  renderLoading();
  const { ok, data } = await apiCall('/contacts/index.php');
  if (ok) {
    allContacts = data;
    renderContacts(data);
    updateStats(data.length, data.length);
  } else {
    showToast('Failed to load contacts', 'error');
  }
}

async function searchContacts(q) {
  renderLoading();
  const { ok, data } = await apiCall(`/contacts/index.php?q=${encodeURIComponent(q)}`);
  if (ok) {
    renderContacts(data);
    updateStats(allContacts.length, data.length);
  }
}

function updateStats(total, showing) {
  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-results').textContent = showing;
}

function renderLoading() {
  document.getElementById('contacts-list').innerHTML = '<div class="spinner"></div>';
}

function renderContacts(contacts) {
  const list = document.getElementById('contacts-list');

  if (!contacts.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="big">📭</div>
        <p>No contacts found.</p>
      </div>`;
    return;
  }

  list.innerHTML = contacts.map(c => `
    <div class="contact-card">
      <div class="contact-avatar">${initials(c.first_name, c.last_name)}</div>
      <div class="contact-info">
        <div class="contact-name">${esc(c.first_name)} ${esc(c.last_name)}</div>
        <div class="contact-meta">${[c.email, c.phone].filter(Boolean).join(' · ') || 'No details'}</div>
      </div>
      <div class="contact-actions">
        <button class="btn-icon edit" title="Edit" onclick="openEditModal(${c.contact_id})">✏️</button>
        <button class="btn-icon del"  title="Delete" onclick="confirmDelete(${c.contact_id}, '${esc(c.first_name)} ${esc(c.last_name)}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

// Escape HTML to prevent XSS in rendered names
function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════════
//  ADD / EDIT MODAL
// ══════════════════════════════════════════════════════════

function openAddModal() {
  document.getElementById('modal-title').textContent = 'Add Contact';
  document.getElementById('edit-id').value = '';
  document.getElementById('c-first').value  = '';
  document.getElementById('c-last').value   = '';
  document.getElementById('c-email').value  = '';
  document.getElementById('c-phone').value  = '';
  document.getElementById('c-notes').value  = '';
  document.getElementById('contact-modal').classList.add('open');
  document.getElementById('c-first').focus();
}

async function openEditModal(id) {
  const { ok, data } = await apiCall(`/contacts/index.php?id=${id}`);
  if (!ok) { showToast('Could not load contact', 'error'); return; }

  document.getElementById('modal-title').textContent = 'Edit Contact';
  document.getElementById('edit-id').value  = data.contact_id;
  document.getElementById('c-first').value  = data.first_name || '';
  document.getElementById('c-last').value   = data.last_name  || '';
  document.getElementById('c-email').value  = data.email      || '';
  document.getElementById('c-phone').value  = data.phone      || '';
  document.getElementById('c-notes').value  = data.notes      || '';
  document.getElementById('contact-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('contact-modal').classList.remove('open');
}

async function handleSaveContact() {
  const id    = document.getElementById('edit-id').value;
  const first = document.getElementById('c-first').value.trim();
  const last  = document.getElementById('c-last').value.trim();

  if (!first || !last) {
    showToast('First and last name are required', 'error');
    return;
  }

  const body = {
    first_name: first,
    last_name:  last,
    email: document.getElementById('c-email').value.trim(),
    phone: document.getElementById('c-phone').value.trim(),
    notes: document.getElementById('c-notes').value.trim(),
  };

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  let res;
  if (id) {
    res = await apiCall(`/contacts/index.php?id=${id}`, 'PUT', body);
  } else {
    res = await apiCall('/contacts/index.php', 'POST', body);
  }

  btn.disabled = false; btn.textContent = 'Save Contact';

  if (res.ok) {
    showToast(id ? 'Contact updated!' : 'Contact added!');
    closeModal();
    loadContacts();
  } else {
    showToast(res.data.error || 'Save failed', 'error');
  }
}

// Close modal on overlay click
document.getElementById('contact-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ══════════════════════════════════════════════════════════
//  DELETE CONFIRM
// ══════════════════════════════════════════════════════════

function confirmDelete(id, name) {
  const modal = document.getElementById('confirm-modal');
  modal.classList.add('open');
  const btn = document.getElementById('confirm-delete-btn');
  // Replace listener cleanly
  const newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.addEventListener('click', async () => {
    const { ok, data } = await apiCall(`/contacts/index.php?id=${id}`, 'DELETE');
    closeConfirm();
    if (ok) {
      showToast(`${name} deleted`);
      loadContacts();
    } else {
      showToast(data.error || 'Delete failed', 'error');
    }
  });
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('open');
}

document.getElementById('confirm-modal').addEventListener('click', function(e) {
  if (e.target === this) closeConfirm();
});

// Close modals on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(); }
});
</script>
